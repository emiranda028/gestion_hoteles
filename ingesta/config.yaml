# Configuración de la ingesta.
#
# hoteles:
#   id           identificador interno (no cambiar una vez cargados datos)
#   opera        nombre del hotel tal como aparece en la primera línea de los reportes de Opera
#   base         nombre de la columna "Empresa" en la base histórica HF.xlsb / Power BI
#   grupo        sociedad a la que pertenece (para disponibilidades)
#   habitaciones habitaciones construidas
#   activo       false para hoteles que ya no mandan reportes (quedan en el histórico)

gmail:
  usuario_env: GMAIL_USER            # agencialtelc@gmail.com
  password_env: GMAIL_APP_PASSWORD   # contraseña de aplicación de Google
  carpeta: INBOX
  # Sintaxis del buscador de Gmail. Los reportes llegan como PDF o dentro de un .zip,
  # y las disponibilidades como .xlsx.
  busqueda: "has:attachment newer_than:4d"
  etiqueta_procesado: "Dashboard/Procesado"

grupos:
  - id: panatel
    nombre: "Panatel"
    detectar: ["PANATEL"]
    base: ["Marriott", "SHERATON BCR", "SHERATON MDQ"]
  - id: numah
    nombre: "Numah"
    detectar: ["NUMAH"]
    base: ["Maitei", "CITY EXPRESS PLUS"]

hoteles:
  - id: marriott
    nombre: "Marriott Buenos Aires"
    opera: "Buenos Aires Marriott"
    base: "MARRIOTT"
    grupo: panatel
    habitaciones: 300
  - id: sheraton-mdq
    nombre: "Sheraton Mar del Plata"
    opera: "Sheraton Mar Del Plata"
    base: "SHERATON MDQ"
    grupo: panatel
    habitaciones: 194
  - id: sheraton-bcr
    nombre: "Sheraton Bariloche"
    opera: "Sheraton Bariloche"
    base: "SHERATON BCR"
    grupo: panatel
    habitaciones: 161
  - id: city-express
    nombre: "City Express Palermo"
    opera: "City Express by Marriott Palermo"
    base: "CITY EXPRESS PLUS"
    grupo: numah
    habitaciones: 51
  - id: maitei
    nombre: "Maitei Posadas"
    opera: "Maitei"
    base: "MAITEI"
    grupo: numah
    habitaciones: 98
    activo: false
