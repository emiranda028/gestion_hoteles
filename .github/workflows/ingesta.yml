name: Ingesta diaria de reportes

on:
  schedule:
    # 09:15, 12:15 y 18:15 hora de Argentina (UTC-3)
    - cron: "15 12 * * *"
    - cron: "15 15 * * *"
    - cron: "15 21 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: ingesta
  cancel-in-progress: false

jobs:
  ingesta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ingesta/requirements.txt

      - run: pip install -r ingesta/requirements.txt

      - name: Leer reportes de Gmail
        id: gmail
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python -m ingesta.run gmail
        continue-on-error: true

      # Planilla de huéspedes por país (Marriott BA) compartida en Drive con "cualquier persona con el enlace".
      # Variable del repositorio PAISES_URL, p. ej.:
      #   https://docs.google.com/spreadsheets/d/ID/export?format=xlsx   (si es una hoja de Google)
      #   https://drive.google.com/uc?export=download&id=ID              (si es un .xlsx subido a Drive)
      - name: Huéspedes por país (Drive)
        if: vars.PAISES_URL != ''
        run: |
          curl -sSL "${{ vars.PAISES_URL }}" -o /tmp/paises.xlsx
          python -m ingesta.run paises /tmp/paises.xlsx
        continue-on-error: true

      - name: Tipo de cambio BNA
        run: python -m ingesta.tipo_cambio

      # Los datos de los hoteles (facturación, saldos bancarios) solo se guardan si el repositorio es privado
      - name: Guardar datos
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(gh api repos/${{ github.repository }} --jq .private)" != "true" ]; then
            echo "::error::El repositorio es público: no se suben datos reales. Hacerlo privado en Settings > General."
            exit 1
          fi
          git add -f data/
          git config user.name "ingesta-automatica"
          git config user.email "ingesta@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Datos: ingesta $(date -u +%F\ %H:%M) UTC"
            git push
          fi

      # Si algún PDF no se pudo leer, el job queda en rojo y GitHub avisa por mail.
      - name: Avisar errores de lectura
        if: steps.gmail.outcome == 'failure'
        run: |
          cat data/ultima_ingesta.json || true
          exit 1
